name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e . --no-deps

      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check src tests app

      # The leakage guard is the reason this repo has CI at all: it must fail the
      # build if anyone re-introduces price_per_sqft as a feature.
      - name: Leakage guard
        run: pytest tests/test_leakage_guard.py -v

      # Train/serve schema contract: the serving path must produce the same frame
      # the training path does. Cheap, and it catches a class of bug that no amount
      # of cross-validation can see.
      - name: Schema contract
        run: pytest tests/test_schema.py -v

      - name: Test
        run: pytest --cov=property_price
